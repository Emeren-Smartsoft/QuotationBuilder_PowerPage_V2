<style>
  /* Quote Site \u2014 footer theme override (Intrys-inspired navy) */
  footer.footer,
  footer.footer[data-component-theme],
  footer.footer .footer-bottom,
  body footer.footer {
    background: #0a1733 !important;
    background-image: linear-gradient(120deg, #0a1733 0%, #142347 100%) !important;
    background-color: #0a1733 !important;
    color: rgba(255, 255, 255, 0.78) !important;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  footer.footer .footer-bottom { padding: 22px 0; }
  footer.footer .footer-bottom .smallText,
  footer.footer .footer-bottom p,
  footer.footer .footer-bottom span,
  footer.footer .footer-bottom div,
  footer.footer .footer-bottom h1,
  footer.footer .footer-bottom h2,
  footer.footer .footer-bottom h3,
  footer.footer .footer-bottom h4 {
    color: rgba(255, 255, 255, 0.85) !important;
    margin: 0;
  }
  footer.footer .footer-bottom a {
    color: #93c5fd !important;
    text-decoration: none;
  }
  footer.footer .footer-bottom a:hover {
    color: #ffffff !important;
    text-decoration: underline;
  }
  footer.footer .footer-bottom .smallText { display: inline; }
</style>
<footer role="contentinfo" class="footer">
  <div class="footer-bottom d-print-none">
    <div class="container">
      <div class="row">
        <div class="col-lg-9 col-md-9 col-sm-9 text-start">
          {% editable snippets 'Footer' type: 'html' %}
        </div>
        <div id="accessibilityLinkContainer" class="col-lg-3 col-md-3 col-sm-3 text-end">
          
        </div>
      </div>
    </div>
</footer>

<script type="text/javascript">
  window.onload = function() {
    const accessibilityLinkContainer = document.getElementById("accessibilityLinkContainer");
    switch(window.navigator.language) {
      case "fr":
        if (accessibilityLinkContainer != null) {
          const accessibilityText="Accessibilité : partiellement conforme";
          const frenchAccessibilityAnchor = document.createElement("a");
          frenchAccessibilityAnchor.id = "frenchAccesssibleLink";
          frenchAccessibilityAnchor.target = "_blank";
          frenchAccessibilityAnchor.href = "https://go.microsoft.com/fwlink/?linkid=2163806";
          frenchAccessibilityAnchor.title = accessibilityText;
          frenchAccessibilityAnchor.innerText = accessibilityText;
          accessibilityLinkContainer.appendChild(frenchAccessibilityAnchor);
        }
        break;
      case "it":
        if (accessibilityLinkContainer != null) {
          const accessibilityText="Accessibilità: parzialmente conforme";
          const italianAccessibilityAnchor = document.createElement("a");
          italianAccessibilityAnchor.id = "italianAccesssibleLink";
          italianAccessibilityAnchor.target = "_blank";
          italianAccessibilityAnchor.href = "https://go.microsoft.com/fwlink/?linkid=2208177";
          italianAccessibilityAnchor.title = accessibilityText;
          italianAccessibilityAnchor.innerText = accessibilityText;
          accessibilityLinkContainer.appendChild(italianAccessibilityAnchor);
        }
        break;
      default: 
        accessibilityLinkContainer.remove();
    }
  };
 </script>
